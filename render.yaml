services:
  - type: web
    name: xiaoyan-chat
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run web_fireboy.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: STREAMLIT_SERVER_PORT
        value: "10000"
      - key: STREAMLIT_SERVER_ADDRESS
        value: "0.0.0.0"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: HF_ENDPOINT
        value: "https://hf-mirror.com"
    healthCheckPath: /
